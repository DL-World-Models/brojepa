data:
  dataset: MNIST
  ops: [1, 2, -1, -2]
  test_ops: [3, 4]  # Unseen operations for testing generalization
  batch_size: 128
  num_workers: 0
  data_root: ./data

model:
  name: resnet18
  num_classes: 10
  op_embed_dim: 32
  mlp_hidden: 256
  op_embedding_type: linear  # Changed from 'embedding' (default)

optim:
  lr: 1e-3
  weight_decay: 1e-4

run:
  epochs: 10
  seed: 42
  runs_dir: runs/baseline
  tag: resnet-linear-ops
  overfit: 0
