data:
  dataset: MNIST
  # operations to include during training (positive/negative integer operands)
  # ops: [1, -1]
  # # operations reserved for testing generalization
  # test_ops: [+3, -3]

  ops: [1, 2, 3, -1, -2, -3] #, -2, +2, +4, -4] #, +5, -5, +6, -6, +7, -7, +8, -8, +9, -9]
  test_ops: [+4, -4]  # Subset of seen ops for embedding mode
  batch_size: 128
  num_workers: 0
  data_root: ./data

model:
  # Dimension of operation embeddings
  op_embed_dim: 32
  # Embedding type. Options include:
  #  - 'embedding' : fixed lookup table for discrete ops
  #  - 'linear'    : linear projection of scalar op values
  #  - 'fourier'   : Fourier features + projection
  #  - 'hybrid'    : sign embedding + Fourier magnitude
  #  - 'additive' or 'additive_embedding' : k * base_{+/-} (not normalized)
  #  - 'additive_embedding_normalized'    : (k/9) * base_{+/-} (normalized for 0-9)
  op_embedding_type: "additive_embedding_normalized"

  # Encoder selection: 'mlp', 'cnn', or 'vit'
  encoder_type: 'mlp' # 'cnn' or 'vit'
  latent_dim: 32

  # MLP / CNN encoder options
  encoder_normalize: True
  activation: 'relu'
  encoder_hidden_dim: 256

  # ViT encoder options (used when encoder_type == 'vit')
  patch_size: 7
  d_model: 128
  depth: 4
  nhead: 4
  mlp_dim: 256
  use_cls_token: True

  # JEPA predictor settings
  predictor_dropout: 0.2
  predictor_hidden_dim: [256, 256]
  predictor_normalize: True

  # Classification head (optional supervision)
  classifier_hidden_dim: 64
  num_classes: 10

  # EMA update rate for target encoder (if used)
  momentum: 0.99 # typical values: 0.99 - 0.9996

  # VICReg-style regularizer settings (if enabled)
  use_vic_reg: False
  lamda: 25  # invariance weight
  miu: 25    # variance weight
  nu: 1.0    # covariance weight
  gamma: 1.0 # hinge threshold for variance reg

optim:
  lr: 1e-4
  weight_decay: 0
  # weight for classification supervision (0 disables gradient contribution)
  cls_weight: 0

run:
  # Classification warmup before JEPA phase.
  warmup_epochs: 0
  warmup_lr: 1e-4  # null to reuse optim.lr
  freeze_context_post_warmup: False # freeze encoder after warmup
  epochs: 25
  seed: 42
  runs_dir: runs/jepa
  tag: additive_test
