data:
  dataset: MNIST
  ops: [1, 2]
  test_ops: [3, 4]  # Unseen operations for testing
  batch_size: 128
  num_workers: 0
  data_root: ./data

model:
  name: simple_fc2
  num_classes: 10
  op_embed_dim: 32
  mlp_hidden: 256

optim:
  lr: 0.001
  weight_decay: 0.0001

run:
  epochs: 2
  seed: 42
  runs_dir: runs/baseline
  tag: simple-fc2-unseen-ops
  overfit: 0
