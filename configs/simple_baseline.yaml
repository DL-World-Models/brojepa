data:
  dataset: MNIST
  ops: [1, 2, -1, -2]
  batch_size: 128
  num_workers: 0
  data_root: ./data

model:
  name: simple_fc2
  num_classes: 10
  op_embed_dim: 32
  mlp_hidden: 256

optim:
  lr: 0.001
  weight_decay: 0.0001

run:
  epochs: 10
  seed: 42
  runs_dir: runs/baseline
  tag: simple-fc2-baseline
  overfit: 0
