repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # ruff replaces black + isort + flake8. Version is pinned to match
  # requirements-dev.txt so local / pre-commit / CI all run the exact same
  # ruff build — no drift between the three.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      # Lint: auto-fix what's safe, warn on the rest, never block the commit.
      # --exit-zero means non-fixable lint issues print to stdout but pre-commit
      # still marks the hook passed. The only way this hook fails is if ruff
      # auto-fixed something (pre-commit always fails when a hook modifies
      # files, so you re-stage and commit again — same UX as ruff-format).
      - id: ruff-check
        args: [--fix, --exit-zero]
      # Format: auto-fix. Identical re-stage UX to the old black hook.
      - id: ruff-format
