name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Patch-flexible: resolves to the latest 3.13.x at job runtime.
          python-version: '3.13'

      # Run pre-commit hooks (trailing-whitespace, end-of-file, check-yaml,
      # check-added-large-files, ruff-format, ruff-check). Formatting drift
      # will fail this step — which is desired. Ruff check is --exit-zero in
      # the hook config, so lint warnings never fail pre-commit here either.
      - uses: pre-commit/action@v3.0.1

      # Non-blocking lint signal: run ruff check without --exit-zero so the
      # full diagnostic output lands in the step log, and mark the step
      # continue-on-error so a failure shows as a yellow warning in the PR
      # instead of blocking the merge. If we ever want lint to be a hard
      # gate, just remove the continue-on-error line.
      - name: Lint (non-blocking)
        run: |
          pip install ruff==0.15.10
          ruff check .
        continue-on-error: true
