[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Defaults already include pycodestyle errors (E) + pyflakes (F).
# Add: isort (I), pyupgrade (UP), flake8-bugbear (B).
extend-select = ["I", "UP", "B"]
# Keep black-compatible — E203 is whitespace-before-punctuation, which
# black/ruff-format intentionally produces around slices.
ignore = ["E203"]

[tool.ruff.format]
# ruff format is black-compatible by default; nothing to override.

# ---------------------------------------------------------------------------# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ---------------------------------------------------------------------------# basedpyright (editor-side type-check signal). Not enforced in pre-commit or
# CI — this is a diagnostics channel for editors, not a gate.
#
# Strategy: strict mode with "unknown type" noise downgraded to warning. Real
# type bugs (optional access, wrong arg types, missing returns) stay at error;
# the stub-related noise that torch + research code unavoidably trigger is
# visible but non-fatal. If a diagnostic really doesn't belong, suppress
# per-line with `# pyright: ignore[<rule>]`.
# ---------------------------------------------------------------------------
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

reportMissingTypeStubs = "none"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"

# basedpyright-specific rules (on top of upstream pyright). Very noisy with
# torch / torchvision because their annotations lean on Any in places.
reportAny = "warning"
reportExplicitAny = "warning"
